name: Ask Helios prompt quality gates
on:
  push:
    branches: [feat/ask-helios-clinical-prompt-quality-20261107]
  pull_request:
    paths:
      - api/_lib/ask-helios-clinical.js
      - api/ai/assist.js
      - test/ask-helios-prompt-quality.test.js
permissions:
  contents: read
jobs:
  prompt-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: node --test test/ask-helios-prompt-quality.test.js test/ask-helios-clinical.test.js
      - run: npm run build
