name: Modality size repair workspace
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/modality-size-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-fund
      - name: Export tracked sources and locked tools only
        run: |
          mkdir -p /tmp/helios-size-workspace
          git archive HEAD | tar -x -C /tmp/helios-size-workspace
          find /tmp/helios-size-workspace -name '.env*' -delete
          cp -a node_modules /tmp/helios-size-workspace/node_modules
          tar -czf /tmp/helios-size-workspace.tgz -C /tmp/helios-size-workspace .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helios-size-workspace
          path: /tmp/helios-size-workspace.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
