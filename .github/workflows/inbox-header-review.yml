name: One-off Inbox header visual review
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the real Transcripts page at five widths
        run: |
          node <<'JS'
          const fs=require('node:fs');
          fs.writeFileSync("header-preview.html","<!doctype html><html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Inbox header review</title><style>html,body,#app{height:100%;margin:0}</style></head><body><div id=\"app\"></div><script type=\"module\" src=\"/header-preview.js\"></script></body></html>");
          fs.writeFileSync("header-preview.js","import {createApp} from 'vue';\nimport {createRouter,createMemoryHistory} from 'vue-router';\nimport Transcripts from './src/views/Transcripts.vue';\nimport './src/main.css';\nconst router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:Transcripts}]});\ncreateApp(Transcripts).use(router).mount('#app');\n");
          fs.writeFileSync("/tmp/verify-inbox-header.cjs","const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');\n(async()=>{\n const browser=await chromium.launch({headless:true,args:['--no-sandbox']});\n const page=await browser.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));\n await page.route('**/src/lib/api.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const authenticatedFetch=(url,options)=>fetch(url,options); export const withSessionRecovery=(fn)=>fn();'}));\n await page.route('**/src/lib/clients.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const listClients=async()=>[]; export const createClient=async()=>({id:\"example\",name:\"Example\"});'}));\n await page.route('**/src/lib/sessions.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const listSessions=async()=>[];'}));\n const row={id:'example',meetingId:'000000001',sourceTitle:'Example session',receivedAt:'2026-11-11T08:47:00Z',sourceOccurredAt:'2026-11-11T08:47:00Z',updatedAt:'2026-11-11T08:47:00Z',status:'assigned',clientId:'example-client',sessionRef:'encounter',attentionClearedAt:'2026-11-11T08:47:00Z'};\n await page.route('**/api/zoom/transcripts*',r=>r.fulfill({json:{transcripts:[row]}}));\n for(let i=0;i<50;i++){try{await fetch('http://127.0.0.1:5175/header-preview.html');break}catch{await new Promise(r=>setTimeout(r,200))}}\n await page.goto('http://127.0.0.1:5175/header-preview.html');await page.locator('.inbox-topbar').waitFor();await page.locator('.inbox-search').waitFor();\n const results=[];\n for(const width of [1280,820,640,390,320]){\n  await page.setViewportSize({width,height:850});\n  const result=await page.evaluate(()=>{\n   const top=document.querySelector('.inbox-import-actions button'),bottom=document.querySelector('.filters button:nth-child(2)'),heading=document.querySelector('h1').getBoundingClientRect(),search=document.querySelector('.inbox-search').getBoundingClientRect();\n   const a=getComputedStyle(top),b=getComputedStyle(bottom);\n   return {width:innerWidth,overflow:document.documentElement.scrollWidth>innerWidth,topHeight:top.getBoundingClientRect().height,bottomHeight:bottom.getBoundingClientRect().height,sameFont:a.fontSize===b.fontSize,sameBackground:a.backgroundColor===b.backgroundColor,sameColor:a.color===b.color,searchInHeading:!!document.querySelector('.header-heading .inbox-search'),searchInFilters:!!document.querySelector('.queue-controls .inbox-search'),besideHeading:search.left>=heading.right && search.top<heading.bottom && search.bottom>heading.top};\n  });\n  if(result.overflow||result.topHeight!==result.bottomHeight||!result.sameFont||!result.sameBackground||!result.sameColor||!result.searchInHeading||result.searchInFilters)throw Error('Layout mismatch: '+JSON.stringify(result));\n  if(width>=820&&!result.besideHeading)throw Error('Search is not beside the heading: '+JSON.stringify(result));\n  results.push(result);\n  if(width===1280||width===390)await page.screenshot({path:'/tmp/balanced-inbox-'+width+'.png'});\n }\n await page.setViewportSize({width:1280,height:850});\n await page.getByRole('button',{name:'History',exact:true}).click();\n await page.getByRole('searchbox',{name:'Search transcripts',exact:true}).fill('Example session');\n if(await page.locator('.transcript-row').count()!==1)throw Error('Search/filter stopped working');\n await page.getByRole('button',{name:'Paste transcript',exact:true}).click();\n if(!(await page.locator('#pasted-transcript').isVisible()))throw Error('Paste action stopped working');\n if(errors.length)throw Error(errors.join('\\n'));\n console.log(JSON.stringify({layouts:results,searchAndPaste:'passed',errors}));await browser.close();\n})().catch(e=>{console.error(e);process.exit(1)});\n");
          JS
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5175 > /tmp/header-vite.log 2>&1 &
          node /tmp/verify-inbox-header.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-inbox-header
          path: /tmp/balanced-inbox-*.png
