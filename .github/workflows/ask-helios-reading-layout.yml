name: Ask Helios reading-layout verification
on:
  push:
    branches: [feat/ask-helios-reading-layout-20261107]
  pull_request:
    paths:
      - src/components/ui/AskHeliosPanel.vue
      - src/components/ui/AskHeliosPanel.spec.js
      - scripts/verify-ask-helios-scroll.mjs
permissions:
  contents: read
jobs:
  reading-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - name: Focused UI and scroll tests
        run: npx vitest run src/components/ui/AskHeliosPanel.spec.js src/components/ui/AskHeliosPanel.scroll.spec.js
      - name: Browser layout test (synthetic records only)
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-ask-helios-scroll.mjs
      - name: Build
        run: npm run build
