name: Session header regression verification

on:
  push:
    branches: [fix/session-header-regression]
    paths:
      - src/components/workspace/SessionWorkspaceHeader.vue
      - .github/workflows/session-header-regression.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Run the smallest relevant test first
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-timeout=10000 --test-reporter=tap test/session-workspace-simplified.test.js
      - name: Install committed dependencies
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Build after the focused test passes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm run build
