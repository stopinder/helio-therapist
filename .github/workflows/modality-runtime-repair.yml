name: Verify live-generation contract repair
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/modality-runtime-repair.yml]
permissions:
  contents: read
concurrency:
  group: helios-modality-runtime-repair
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed source repair
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.github/modality-runtime-repair.patch.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'e1e5162fac2e20e33170be5bfea94d97decac374b6376145799862925875b7b6'
          Path('/tmp/modality-runtime-repair.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/modality-runtime-repair.patch
          git apply --unidiff-zero /tmp/modality-runtime-repair.patch
          git diff --check
          mkdir -p test-results/runtime-repair
      - run: npm ci --ignore-scripts --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Complete Node regression suite
        run: |
          node --test --test-concurrency=4 'test/**/*.test.js' > test-results/runtime-repair/node-tests.log 2>&1 || { tail -n 140 test-results/runtime-repair/node-tests.log; exit 1; }
          tail -n 14 test-results/runtime-repair/node-tests.log
      - name: Complete components and real TA API integration suite
        run: |
          npm run test:components -- --maxWorkers=2 > test-results/runtime-repair/component-tests.log 2>&1 || { tail -n 140 test-results/runtime-repair/component-tests.log; exit 1; }
          tail -n 14 test-results/runtime-repair/component-tests.log
      - name: Compile production-format bundle without production deployment
        run: npm run build
      - name: Offline modality contract comparison
        run: node scripts/evaluate-modality-intelligence.mjs --output=test-results/runtime-repair/modality-contracts.json
      - name: Install synthetic browser
        run: npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 50 /tmp/browser-install.log; exit 1; }
      - name: Verify CBT and TA generation and recovery on desktop and mobile
        run: |
          node scripts/verify-modality-preview.mjs > test-results/runtime-repair/browser-tests.log 2>&1 || { cat test-results/runtime-repair/browser-tests.log; exit 1; }
          cat test-results/runtime-repair/browser-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modality-runtime-repair-verification
          path: |
            test-results/runtime-repair/
            test-results/modality-preview/*.png
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: verify
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialise only the verified changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.github/modality-runtime-repair.patch.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'e1e5162fac2e20e33170be5bfea94d97decac374b6376145799862925875b7b6'
          Path('/tmp/modality-runtime-repair.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/modality-runtime-repair.patch
          git apply --unidiff-zero /tmp/modality-runtime-repair.patch
          git add api/_lib/modality-intelligence/contracts.js api/_lib/modality-intelligence/pipeline.js api/ai/modality-summary.js docs/architecture/modality-intelligence-preview.md scripts/verify-modality-preview.mjs src/lib/modalityIntelligence.js src/lib/modalityIntelligenceApi.spec.js src/lib/summaryModalities.js test/fixtures/modality-intelligence.js test/fixtures/recent-session-generation.js test/modality-evidence-batches.test.js test/modality-evidence-passages.test.js test/modality-intelligence.test.js test/modality-composition-contract.test.js
          git rm .github/modality-runtime-repair.patch.b64 .github/workflows/modality-runtime-repair.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render cited summary claims once and diagnose final validation failures'
      - name: Fast-forward the preview branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/modality-intelligence-preview-20261110
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/modality-intelligence-preview-20261110
          git rev-parse HEAD
