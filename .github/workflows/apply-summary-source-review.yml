name: Apply summary source review
on:
  push:
    branches: [fix/summary-source-review-20261105]
    paths: [.github/workflows/apply-summary-source-review.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/summary-source-review-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply guarded integration to this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-summary-review-integration.py
          python3 scripts/apply-summary-review-ui.py
          python3 scripts/finalize-summary-review-integration.py
          git diff --check
          node --check api/ai/session-summary.js
          node --check api/ai/client-session-summary.js
          node --check api/zoom/source-review.js
      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Test outcomes, all migrations, isolation and old workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test test/summary-source-outcomes.test.js test/summary-source-review-db.test.js test/session-summary-generation-ui.test.js test/session-workspace-simplified.test.js test/transcript-clear-behaviour.test.js | tee /tmp/source-review-tests.log
      - name: Build the production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee /tmp/source-review-build.log
      - name: Save verified integration on its feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/summary-source-review-20261105
          git add api src test
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: wire verified source review into summary generation and sharing'
          cat > /tmp/source-review-askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 /tmp/source-review-askpass.sh
          GIT_ASKPASS=/tmp/source-review-askpass.sh GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/fix/summary-source-review-20261105
          rm -f /tmp/source-review-askpass.sh
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test real desktop and mobile review controls using synthetic fixtures
        run: npx playwright test --config playwright.source-review.config.js
      - name: Package source and verification output only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-review-result
          git diff --binary > /tmp/source-review-result/uncommitted.patch
          git rev-parse HEAD > /tmp/source-review-result/head.txt
          tar --exclude='*.env' --exclude='.env*' --exclude='*/.env*' --exclude='*.pem' --exclude='*.key' --exclude='*/.temp' --exclude='*/.branches' -czf /tmp/source-review-result/source.tgz src api test e2e supabase scripts package.json package-lock.json index.html vite.config.mjs vitest.config.js playwright.source-review.config.js
          for file in /tmp/source-review-tests.log /tmp/source-review-build.log; do if test -f "$file"; then cp "$file" /tmp/source-review-result/; fi; done
          if test -d test-results; then cp -R test-results /tmp/source-review-result/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-review-integrated-result
          path: /tmp/source-review-result/
          retention-days: 2
          compression-level: 0
