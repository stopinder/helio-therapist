name: One-off shared transcript reader review
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify shared reader with synthetic source
        run: |
          node <<'JS'
          const fs=require('node:fs');
          fs.writeFileSync("reader-preview.html","<!doctype html><html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Transcript reader review</title></head><body><div id=\"app\"></div><script type=\"module\" src=\"/reader-preview.js\"></script></body></html>");
          fs.writeFileSync("reader-preview.js","import { createApp,h } from 'vue';\nimport { createRouter,createMemoryHistory } from 'vue-router';\nimport TranscriptInbox from './src/components/TranscriptInbox.vue';\nimport './src/main.css';\nconst empty={render:()=>h('div')};\nconst router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:empty}]});\ncreateApp({render:()=>h(TranscriptInbox,{clients:[]})}).use(router).mount('#app');\n");
          fs.writeFileSync("/tmp/verify-reader.cjs","const { chromium } = require(process.cwd() + '/node_modules/@playwright/test');\n(async () => {\n  const browser = await chromium.launch({headless:true, args:['--no-sandbox']});\n  const page = await browser.newPage();\n  const errors = [], writes = [];\n  page.on('pageerror', error => errors.push(error.message));\n  await page.route('**/src/lib/api.js*', r => r.fulfill({contentType:'application/javascript',body:'export const authenticatedFetch=(url,options)=>fetch(url,options); export const withSessionRecovery=(fn)=>fn();'}));\n  await page.route('**/src/lib/clients.js*', r => r.fulfill({contentType:'application/javascript',body:'export const listClients=async()=>[]; export const createClient=async()=>({id:\"example\",name:\"Example\"});'}));\n  await page.route('**/src/lib/sessions.js*', r => r.fulfill({contentType:'application/javascript',body:'export const listSessions=async()=>[];'}));\n  const row = {id:'example-source',meetingId:'000000001',receivedAt:'2026-11-11T08:47:00Z',sourceOccurredAt:'2026-11-11T08:47:00Z',updatedAt:'2026-11-11T08:47:00Z',status:'unassigned',clientId:null,sessionRef:null};\n  const source = Array.from({length:90}, (_,i) => `[ ] Unknown: ${i===89 ? 'A distinctive identifying clue at the end.' : 'Example source passage '+(i+1)+'. '+ 'A longer synthetic passage for reviewing the transcript layout. '.repeat(6)}`).join(' ');\n  await page.route('**/api/zoom/transcripts*', async r => {\n    if(r.request().method()!=='GET') writes.push(r.request().method());\n    await r.fulfill({json:r.request().url().includes('?id=') ? {transcript:{...row,text:source}} : {transcripts:[row]}});\n  });\n  for(let i=0;i<50;i++){try{await fetch('http://127.0.0.1:5175/reader-preview.html');break}catch{await new Promise(r=>setTimeout(r,200))}}\n  for(const width of [1280,820,390,320]) {\n    await page.setViewportSize({width,height:900});\n    await page.goto('http://127.0.0.1:5175/reader-preview.html');\n    await page.getByRole('button',{name:'Preview transcript',exact:true}).click();\n    const preview=page.getByRole('region',{name:'Transcript preview',exact:true});\n    await preview.waitFor();\n    if(!(await preview.evaluate(el=>document.activeElement===el))) throw Error('Preview did not receive focus');\n    if(await page.locator('.triage-preview').count()) throw Error('Duplicate raw excerpt rendered');\n    if((await preview.innerText()).includes('[ ] Unknown:')) throw Error('Raw prefix in readable preview');\n    if(width===1280 || width===390) await page.screenshot({path:'/tmp/transcript-reader-'+width+'.png'});\n    await preview.getByRole('searchbox').fill('distinctive identifying clue');\n    if(await preview.locator('.reader-passage').count()!==1) throw Error('Search missed source beyond initial page');\n    if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)) throw Error('Horizontal overflow at '+width);\n    await preview.getByRole('button',{name:'Open full transcript',exact:true}).click();\n    await page.getByPlaceholder('Search this transcript').fill('distinctive identifying clue');\n    if(await page.locator('.reader-passage').count()!==1) throw Error('Full reader search failed');\n    await page.getByRole('button',{name:'Raw source',exact:true}).click();\n    if((await page.locator('.raw-source-panel pre').textContent())!==source) throw Error('Raw source changed');\n  }\n  if(errors.length || writes.length) throw Error(JSON.stringify({errors,writes}));\n  console.log(JSON.stringify({widths:[1280,820,390,320],previewFocus:'passed',wholeSourceSearch:'passed',fullReaderSearch:'passed',rawSourceFidelity:'passed',writes,errors}));\n  await browser.close();\n})().catch(error=>{console.error(error);process.exit(1)});\n");
          JS
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5175 > /tmp/reader-vite.log 2>&1 &
          node /tmp/verify-reader.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-transcript-reader
          path: /tmp/transcript-reader-*.png
