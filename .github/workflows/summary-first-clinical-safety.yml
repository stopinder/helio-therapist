name: Summary-first source and therapist approval checks
on:
  push:
    branches: [feat/summary-first-clinical-workflow-20261107, fix/source-review-one-click-confirm-20261108, fix/source-review-confirm-actionable-20261108, fix/reassign-reviewed-transcript-source-20261108]
  pull_request:
    paths:
      - api/ai/session-summary.js
      - api/_lib/summary-draft-policy.js
      - api/_lib/source-review.js
      - api/zoom/source-review.js
      - api/zoom/transcripts.js
      - supabase/migrations/*reassign_reviewed_transcript_source.sql
      - api/documents.js
      - src/views/SessionWorkspace.vue
      - src/components/workspace/SourceReviewPanel.vue
      - src/components/workspace/SourceReviewPanel.spec.js
      - src/lib/sourceReviewOneClickApi.spec.js
      - test/summary-first-workflow.test.js
      - test/source-review-one-click.test.js
      - test/source-reassignment-contract.test.js
      - test/session-correction-preservation.test.js
      - src/components/TranscriptInbox.vue
      - src/components/workspace/ClientDocumentComposer.vue
permissions:
  contents: read
jobs:
  clinical-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: node --test test/session-correction-preservation.test.js test/source-reassignment-contract.test.js test/source-review-one-click.test.js test/summary-first-workflow.test.js test/summary-source-outcomes.test.js test/session-summary-generation-ui.test.js
      - run: npx vitest run src/components/workspace/SourceReviewPanel.spec.js src/lib/sourceReviewOneClickApi.spec.js src/components/workspace/SourceReviewDialog.spec.js
      - run: npm run build
