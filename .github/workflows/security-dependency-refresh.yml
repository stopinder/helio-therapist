name: Security dependency refresh
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - security/remove-vulnerable-dependency-chains-20261109
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace obsolete pins and upgrade dependency graph
        run: |
          npm pkg delete overrides
          npm install --save-dev --save-exact @vue/test-utils@2.4.11
          npm install --save-dev happy-dom@latest vite@latest vitest@latest
          npm install @vercel/functions@latest
          npm update
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-fund
          npm ls js-beautify editorconfig glob minimatch || true
      - name: Verify full audit
        run: npm audit --audit-level=moderate
      - name: Run unit, component and build checks
        run: |
          npm test
          npm run test:components
          npm run build
      - name: Commit only verified manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace vulnerable dependency chains with current supported versions [skip ci]"
            git push origin HEAD:security/remove-vulnerable-dependency-chains-20261109
          fi
