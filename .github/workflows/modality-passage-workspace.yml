name: Passage repair source workspace
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/modality-passage-workspace.yml]
permissions:
  contents: read
jobs:
  source-workspace:
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tracked application sources only
        run: |
          python3 - <<'PY'
          import subprocess, tarfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          roots = {'api', 'src', 'test', 'scripts', 'docs', 'e2e', 'public', '.github'}
          with tarfile.open('/tmp/helios-passage-source.tgz', 'w:gz') as archive:
              for name in paths:
                  if not name:
                      continue
                  path = Path(name)
                  if any(part.startswith('.env') or part in {'.vercel', '.auth', 'playwright-report', 'test-results'} for part in path.parts):
                      continue
                  if path.parts[0] in roots or (len(path.parts) == 1 and path.suffix in {'.js', '.mjs', '.cjs', '.json', '.html', '.css'}):
                      archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helios-passage-source
          path: /tmp/helios-passage-source.tgz
          retention-days: 1
          if-no-files-found: error
