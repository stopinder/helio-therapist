name: Modality passage repair workspace
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/modality-passage-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export tracked non-secret sources only
        run: |
          mkdir -p /tmp/helios-passage-source
          git archive HEAD | tar -x -C /tmp/helios-passage-source
          find /tmp/helios-passage-source -name '.env*' -delete
          tar -czf /tmp/helios-passage-source.tgz -C /tmp/helios-passage-source .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helios-passage-source
          path: /tmp/helios-passage-source.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
