name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run Node tests
        run: npm test

      - name: Run Vue component tests
        run: npm run test:components

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Ask Helios restored scroll in desktop and mobile Chromium
        run: node scripts/verify-ask-helios-scroll.mjs

      - name: Run Zoom My Notes Playwright acceptance
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: playwright-anon-key
        run: npx playwright test e2e/zoom-my-notes.spec.js --project=chromium

      - name: Run clinical and transcript Playwright acceptance
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: playwright-anon-key
        run: >-
          npx playwright test
          e2e/clinical-record-flow.spec.js
          e2e/transcript-cbt-care.spec.js
          e2e/auth-lifecycle.spec.js
          e2e/transcript-a11y-responsive.spec.js
          --project=chromium
