name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json gained the PDF renderer dependencies before the lockfile was
      # regenerated. Keep CI aligned with Vercel's install path for this release;
      # restoring npm ci is tracked as lockfile maintenance after deployment.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
