name: Verify recent-session size repair
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/install-modality-size-repair.yml]
permissions:
  contents: read
jobs:
  verified-preview-repair:
    if: github.repository == 'stopinder/helio-therapist' && github.ref == 'refs/heads/feat/modality-intelligence-preview-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Materialise exact locally reviewed source changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          raw=lzma.decompress(base64.b64decode(pathlib.Path('.github/modality-size-source.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='d2f70bfd86af58a84289845bda9aa88821eda02bbecc831df67d39df54f9f676'
          manifest=json.loads(raw)
          subprocess.run(['git','merge-base','--is-ancestor',manifest['baseCommit'],'HEAD'],check=True)
          allowed={
            'api/_lib/modality-intelligence/contracts.js',
            'api/_lib/modality-intelligence/pipeline.js',
            'api/_lib/modality-intelligence/sources.js',
            'api/_lib/modality-intelligence/evidence-batches.js',
            'api/ai/modality-summary.js',
            'docs/architecture/modality-intelligence-preview.md',
            'scripts/verify-modality-preview.mjs',
            'src/components/workspace/ClientDocumentComposer.vue',
            'src/components/workspace/SummaryEvidenceLimitNotice.vue',
            'src/components/workspace/__tests__/ClientDocumentComposer.spec.js',
            'src/lib/modalityIntelligenceApi.spec.js',
            'src/views/SessionWorkspace.vue',
            'test/modality-evidence-batches.test.js'
          }
          assert set(item['path'] for item in manifest['files'])==allowed
          assert len(manifest['files'])==len(allowed)
          for item in manifest['files']:
            path=pathlib.Path(item['path'])
            if 'before' in item:
              text=path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['before'], 'Source changed: '+item['path']
              for start,end,replacement in reversed(item['edits']):
                text=text[:start]+replacement+text[end:]
            else:
              assert not path.exists(), 'New file already exists'
              text=item['text']
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'], 'Result differs: '+item['path']
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_text(text)
          pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed-size-repair.json').write_bytes(raw)
          print('Verified source hashes for',len(allowed),'files; preview branch only.')
          PY
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - name: Run complete Node regression suite
        run: npm test
      - name: Run complete Vue component regression suite
        run: npm run test:components
      - name: Compile production bundle without deploying
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify branded desktop and mobile evidence recovery
        run: node scripts/verify-modality-preview.mjs
      - name: Commit only the exact verified sources to preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repo='stopinder/helio-therapist'
          branch='feat/modality-intelligence-preview-20261110'
          expected=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          manifest=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'reviewed-size-repair.json').read_text())
          def api(path,data=None,method=None):
            body=None if data is None else json.dumps(data).encode()
            request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          assert api('/git/ref/heads/'+branch)['object']['sha']==expected, 'Preview branch moved; do not overwrite concurrent work'
          base=api('/git/commits/'+expected)
          tree=[]
          for item in manifest['files']:
            text=pathlib.Path(item['path']).read_text()
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'], 'Test modified reviewed source'
            tree.append({'path':item['path'],'mode':'100644','type':'blob','content':text})
          tree.append({'path':'.github/modality-size-source.b64','mode':'100644','type':'blob','sha':None})
          created=api('/git/trees',{'base_tree':base['tree']['sha'],'tree':tree})
          commit=api('/git/commits',{'message':'Review long recent-session evidence in bounded verified batches; restore actionable recovery','tree':created['sha'],'parents':[expected]})
          assert api('/git/ref/heads/'+branch)['object']['sha']==expected, 'Preview branch moved; no ref changed'
          api('/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},'PATCH')
          print('Verified preview repair commit:',commit['sha'])
          PY
