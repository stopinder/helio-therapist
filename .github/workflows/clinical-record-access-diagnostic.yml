name: Clinical record access verification

on:
  push:
    branches: [fix/clinical-record-access]

permissions:
  contents: read

concurrency:
  group: clinical-record-access-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/clinical-record-access
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      # Run the smallest relevant test first. If it fails, stop and report the exact failure before making another edit.
      - name: Run Clinical Record metadata test first
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "HEAD $(git rev-parse HEAD)"
          node --test --test-concurrency=1 --test-timeout=10000 --test-reporter=tap test/clinical-record-metadata-hardening.test.js

      - name: Run Session Workspace simplification contract second
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-timeout=10000 --test-reporter=tap test/session-workspace-simplified.test.js

      - name: Install committed dependencies
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Build after focused tests pass
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm run build
