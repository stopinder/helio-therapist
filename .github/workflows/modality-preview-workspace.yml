name: Modality preview workspace
on:
  push:
    branches: [feat/modality-intelligence-preview-20261110]
    paths: [.github/workflows/modality-preview-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Package source and locked development tools, without credentials
        run: |
          mkdir -p /tmp/helios-workspace
          git archive HEAD | tar -x -C /tmp/helios-workspace
          find /tmp/helios-workspace -name '.env*' -delete
          cp -a node_modules /tmp/helios-workspace/node_modules
          tar -czf /tmp/helios-workspace.tgz -C /tmp/helios-workspace .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helios-modality-workspace
          path: /tmp/helios-workspace.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
