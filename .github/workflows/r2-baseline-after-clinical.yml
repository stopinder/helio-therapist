name: R2 baseline after clinical fixes

on:
  push:
    branches: [test/r2-baseline-after-clinical]
    paths: [.github/workflows/r2-baseline-after-clinical.yml]

permissions:
  contents: read

concurrency:
  group: r2-baseline-after-clinical
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out integrated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a81c16d98847e31d0fb96e8730d120f671b1c444
          persist-credentials: false

      - name: Use verified Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Establish the integrated baseline before staging accepted test corrections
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a81c16d98847e31d0fb96e8730d120f671b1c444'
          test -z "$(git status --porcelain)"
          echo "Source: $(git rev-parse HEAD)"
          echo "Session workspace: $(git hash-object src/views/SessionWorkspace.vue)"
          echo "Session header: $(git hash-object src/components/workspace/SessionWorkspaceHeader.vue)"
          echo "Clinical spine: $(git hash-object test/clinical-spine.test.js)"
          echo "Calendar test: $(git hash-object test/calendar-component.test.js)"
          echo "Documents refinement test: $(git hash-object test/client-documents-refinement.test.js)"
          echo "Documents workflow test: $(git hash-object test/client-documents-workflow.test.js)"

      # Run the smallest relevant test first. If it fails, stop and report the exact failure before making another edit.
      - name: Reconfirm the already accepted Clinical Record slice first
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-timeout=10000 --test-reporter=tap \
            test/clinical-record-metadata-hardening.test.js \
            test/session-workspace-simplified.test.js \
            test/clinical-spine.test.js | tee "$RUNNER_TEMP/clinical-focused.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/clinical-focused.tap"

      - name: Stage only previously classified stale-test corrections and discovery fix in the disposable runner
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';

          const replaceOnce = (file, oldText, newText) => {
            const source = readFileSync(file, 'utf8');
            assert.equal(source.split(oldText).length, 2, `${file}: expected one exact stale assertion`);
            writeFileSync(file, source.replace(oldText, newText));
          };

          replaceOnce(
            'test/calendar-component.test.js',
            "assert.match(calendarSource, /window\\.addEventListener\\('keydown', handleGlobalEsc\\)/)",
            "assert.match(calendarSource, /window\\.addEventListener\\(\\s*'keydown'\\s*,\\s*handleGlobalEsc\\s*\\)/)"
          );
          replaceOnce(
            'test/calendar-component.test.js',
            "assert.match(calendarSource, /const workingHours = Array\\.from\\(\\{ length: 24 \\}/)",
            "assert.match(calendarSource, /const\\s+workingHours\\s*=\\s*Array\\.from\\(\\s*\\{\\s*length\\s*:\\s*24\\s*\\}/)"
          );
          replaceOnce(
            'test/calendar-component.test.js',
            "assert.match(calendarSource, /const popoverWidth = window\\.innerWidth < 640 \\? 280 : 288/)",
            "assert.match(calendarSource, /const\\s+popoverWidth\\s*=\\s*window\\.innerWidth\\s*<\\s*640\\s*\\?\\s*280\\s*:\\s*288\\b/)"
          );
          replaceOnce(
            'test/calendar-component.test.js',
            "assert.match(calendarSource, /if \\(left \\+ popoverWidth \\+ padding > window\\.innerWidth\\)/)",
            "assert.match(calendarSource, /if\\s*\\(\\s*left\\s*\\+\\s*popoverWidth\\s*\\+\\s*padding\\s*>\\s*window\\.innerWidth\\s*\\)/)"
          );
          replaceOnce(
            'test/calendar-component.test.js',
            "assert.match(calendarSource, /if \\(top \\+ popoverHeight \\+ padding > window\\.innerHeight\\)/)",
            "assert.match(calendarSource, /if\\s*\\(\\s*top\\s*\\+\\s*popoverHeight\\s*\\+\\s*padding\\s*>\\s*window\\.innerHeight\\s*\\)/)"
          );

          replaceOnce(
            'test/client-documents-refinement.test.js',
            "assert.match(workspace, /<ClientDocumentsPanel v-else-if=\"activeTab === 'Documents'\"[^>]*:archived=\"client\\.archived\"/);",
            "assert.match(workspace, /<ClientDocumentsPanel\\b[^>]*:archived=\"client\\.archived\"/);"
          );

          replaceOnce(
            'test/client-documents-workflow.test.js',
            "assert.match(workspace,/activeTab === 'Documents'/);",
            `// The panel is in Supporting material; verify its bindings rather than the former tab.\n  const documentsPanel = workspace.match(/<ClientDocumentsPanel\\b[^>]*>/)?.[0] || '';\n  assert.match(documentsPanel, /\\s:documents=\"documents\"/);\n  assert.match(documentsPanel, /\\s@create=\"newDocument\"/);\n  assert.match(documentsPanel, /\\s@edit=\"editDocument\"/);\n  assert.match(documentsPanel, /\\s@download=\"downloadDocument\"/);`
          );

          const packageFile = 'package.json';
          const packageText = readFileSync(packageFile, 'utf8');
          const original = 'node --test test/**/*.test.js';
          const corrected = 'node --test "test/**/*.test.js"';
          assert.equal(JSON.parse(packageText).scripts.test, original, 'Unexpected npm test baseline');
          assert.equal(packageText.split(JSON.stringify(original)).length, 2, 'Expected exactly one test script');
          writeFileSync(packageFile, packageText.replace(JSON.stringify(original), JSON.stringify(corrected)));
          NODE
          git diff --check
          git diff --exit-code -- src api supabase

      - name: Reconfirm the three accepted stale-test corrections
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for file in \
            test/calendar-component.test.js \
            test/client-documents-refinement.test.js \
            test/client-documents-workflow.test.js; do
            echo "Focused accepted correction: $file"
            timeout --signal=TERM --kill-after=5s 30s node --test --test-concurrency=1 --test-timeout=10000 --test-reporter=tap "$file" | tee "$RUNNER_TEMP/$(basename "$file").tap"
          done

      - name: Install committed dependencies without regenerating the lockfile
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Inventory the complete Node test suite
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files = readdirSync('test', { recursive: true })
            .filter(file => file.endsWith('.test.js'))
            .map(file => `test/${file}`)
            .sort();
          assert.equal(files.length, 138, 'Stop if the test inventory changed from the established baseline');
          for (const required of [
            'test/reflection-edit-delete.test.js',
            'test/reflection-edit-delete-ui.test.js',
            'test/negative-authorization.test.js',
            'test/unit/practice-reflection.test.js'
          ]) assert.ok(files.includes(required), `Missing required release test: ${required}`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'r2-test-files.txt'), files.join('\n') + '\n');
          console.log(`Inventory: ${files.length} .test.js files`);
          NODE
          sha256sum package.json test/calendar-component.test.js test/client-documents-refinement.test.js test/client-documents-workflow.test.js test/clinical-spine.test.js src/views/SessionWorkspace.vue src/components/workspace/SessionWorkspaceHeader.vue > "$RUNNER_TEMP/r2-candidate.sha256"

      - name: Run every test file deterministically and stop at the first remaining failure
        id: sweep
        timeout-minutes: 10
        run: |
          set -euo pipefail
          verify_sources() {
            sha256sum --status --check "$RUNNER_TEMP/r2-candidate.sha256"
            git diff --quiet HEAD -- . \
              ':!package.json' \
              ':!test/calendar-component.test.js' \
              ':!test/client-documents-refinement.test.js' \
              ':!test/client-documents-workflow.test.js'
          }
          count=0
          while IFS= read -r file; do
            verify_sources
            echo "Checking $file; completed files: $count; blob: $(git hash-object "$file")"
            if timeout --signal=TERM --kill-after=5s 30s node --test --test-concurrency=1 --test-timeout=20000 --test-reporter=tap "$file" > "$RUNNER_TEMP/r2-next-failure.tap" 2>&1; then
              verify_sources
              count=$((count + 1))
            else
              result=$?
              echo "::error file=$file::First remaining baseline failure, exit $result. No later file will run."
              {
                printf '\n## First remaining R2 failure\nFile: `%s`\nExit: %s\nCompleted files: %s\n\n```text\n' "$file" "$result" "$count"
                cat "$RUNNER_TEMP/r2-next-failure.tap"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
              node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'r2-next-failure.tap'), 'utf8');
          const first = log.search(/^\s*not ok /m);
          console.log(first >= 0 ? log.slice(first, first + 5000) : log.slice(0, 5000));
          console.log(log.split('\n').filter(line => /^# (tests|pass|fail|cancelled|skipped)|^\s*(location:|code:|expected:|actual:|operator:)|\.test\.js:\d+:\d+/.test(line)).join('\n'));
          NODE
              echo "Exact numbered source of first failing file: $file"
              nl -ba "$file"
              verify_sources
              exit "$result"
            fi
          done < "$RUNNER_TEMP/r2-test-files.txt"
          echo "All $count files completed successfully."

      - name: Run complete npm test only after deterministic sweep succeeds
        id: suite
        timeout-minutes: 4
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 210s npm test

      - name: Build only after complete unit verification
        id: build
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s npm run build

      - name: Record actual results
        if: always()
        env:
          SWEEP: ${{ steps.sweep.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo '## R2 integrated candidate sweep'
            echo 'Base: a81c16d98847e31d0fb96e8730d120f671b1c444 (verified header + secondary Clinical Record access).'
            echo 'Calendar/Documents stale-test corrections and the quoted Node glob are staged only in this disposable checkout.'
            printf 'Deterministic file sweep: %s\nnpm test: %s\nBuild: %s\n' "$SWEEP" "$SUITE" "$BUILD"
            echo 'No browser, live provider credentials, Supabase write, production promotion, or source-file commit was performed by this diagnostic.'
          } >> "$GITHUB_STEP_SUMMARY"
