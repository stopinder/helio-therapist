name: Production Health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Helio production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 3 \
            https://helio.works/api/health)"
          echo "Health response: ${response}"
          test "${response}" = '{"status":"ok"}'
