name: One-off toolbar visual review
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render real Inbox with synthetic records at five widths
        run: |
          node <<'JS'
          const fs=require('node:fs');
          fs.writeFileSync('toolbar-preview.html',"<!doctype html><html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Transcript Inbox layout review</title></head><body><div id=\"app\"></div><script type=\"module\" src=\"/toolbar-preview.js\"></script></body></html>\n");
          fs.writeFileSync('toolbar-preview.js',"import { createApp,h } from 'vue';\nimport { createRouter,createMemoryHistory } from 'vue-router';\nimport TranscriptInbox from './src/components/TranscriptInbox.vue';\nimport './src/main.css';\nconst empty={render:()=>h('div')};\nconst router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:empty},{name:'SessionWorkspace',path:'/clients/:clientId/sessions/:sessionId',component:empty}]});\ncreateApp({render:()=>h(TranscriptInbox,{clients:[{id:'example-client',name:'Example client'}]})}).use(router).mount('#app');\n");
          fs.writeFileSync('/tmp/verify-toolbar.cjs',"const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');\n(async()=>{\nconst browser=await chromium.launch({headless:true,args:['--no-sandbox']});\nconst page=await browser.newPage();\nconst errors=[];page.on('pageerror',e=>errors.push(e.message));\nawait page.route('**/src/lib/api.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const authenticatedFetch=(url,options)=>fetch(url,options); export const withSessionRecovery=(fn)=>fn();'}));\nawait page.route('**/src/lib/clients.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const listClients=async()=>[]; export const createClient=async()=>({id:\"example\",name:\"Example\"});'}));\nawait page.route('**/src/lib/sessions.js*',r=>r.fulfill({contentType:'application/javascript',body:'export const listSessions=async()=>[];'}));\nconst sample={meetingId:'000000001',sourceTitle:'Example session',receivedAt:'2026-11-11T08:47:00Z',sourceOccurredAt:'2026-11-11T08:47:00Z',updatedAt:'2026-11-11T08:47:00Z',status:'unassigned',clientId:null,sessionRef:null,attentionClearedAt:null,inboxArchivedAt:null,completedAt:null,sourceReview:{},text:null};\nconst rows=Array.from({length:7},(_,i)=>({...sample,id:'example-'+i,sourceTitle:i===1?'Example two':'Example session '+(i+1)}));\nrows.push({...sample,id:'assigned',clientId:'example-client',sessionRef:'encounter',attentionClearedAt:'saved'});\nrows.push({...sample,id:'archived',inboxArchivedAt:'saved',attentionClearedAt:'saved'});\nawait page.route('**/api/zoom/transcripts*',r=>r.fulfill({json:{transcripts:rows}}));\nawait page.setViewportSize({width:1280,height:850});\nfor(let i=0;i<50;i++){try{await fetch('http://127.0.0.1:5175/toolbar-preview.html');break}catch{await new Promise(r=>setTimeout(r,200))}}\nawait page.goto('http://127.0.0.1:5175/toolbar-preview.html');await page.locator('.queue-controls').waitFor();\nawait page.screenshot({path:'/tmp/inbox-toolbar-desktop.png'});\nconst results=[];\nfor(const width of [1280,820,640,390,320]){\nawait page.setViewportSize({width,height:850});\nresults.push(await page.evaluate(()=>({width:innerWidth,overflow:document.documentElement.scrollWidth>innerWidth,searchWidth:document.querySelector('.inbox-search').getBoundingClientRect().width,searchRight:Math.round(document.querySelector('.inbox-search').getBoundingClientRect().right),toolbarRight:Math.round(document.querySelector('.queue-controls').getBoundingClientRect().right),buttonHeight:document.querySelector('.filters button').getBoundingClientRect().height,toolbarHeight:document.querySelector('.queue-controls').getBoundingClientRect().height})));\nif(width===390)await page.screenshot({path:'/tmp/inbox-toolbar-mobile.png'});\n}\nawait page.setViewportSize({width:1280,height:850});\nawait page.getByRole('searchbox').fill('Example two');\nif(await page.locator('.transcript-row').count()!==1)throw Error('Search did not filter to one transcript');\nawait page.getByRole('searchbox').fill('');\nawait page.getByRole('button',{name:'History',exact:true}).click();\nif(await page.locator('.transcript-row').count()!==1)throw Error('History did not filter');\nawait page.getByRole('button',{name:'Archived',exact:true}).click();\nif(await page.locator('.transcript-row').count()!==1)throw Error('Archive did not filter');\nif(results.some(r=>r.overflow))throw Error('Horizontal overflow: '+JSON.stringify(results));\nif(errors.length)throw Error(errors.join('\\n'));\nconsole.log(JSON.stringify({layouts:results,searchAndFilters:'passed',pageErrors:errors}));\nawait browser.close();\n})().catch(e=>{console.error(e);process.exit(1)});\n");
          JS
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5175 > /tmp/toolbar-vite.log 2>&1 &
          node /tmp/verify-toolbar.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-toolbar-layout
          path: /tmp/inbox-toolbar-*.png
