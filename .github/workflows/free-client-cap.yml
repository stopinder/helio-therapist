name: Free client cap (isolated PostgreSQL)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**enforce_free_active_client_limit.sql'
      - 'test/sql/free-client-cap-*.sql'
      - 'test/free-client-cap-sql.test.js'
      - 'scripts/verify-free-client-race.sh'
      - '.github/workflows/free-client-cap.yml'

permissions:
  contents: read

jobs:
  verify-free-client-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helios_test
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: helios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: helios_test
      PGPASSWORD: local-only
      PGDATABASE: helios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check migration invariants
        run: node --test test/free-client-cap-sql.test.js
      - name: Install PostgreSQL test client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create synthetic tables and execute migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -f test/sql/free-client-cap-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020150100_enforce_free_active_client_limit.sql
      - name: Verify insert, archive, unarchive, downgrade, ownership and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f test/sql/free-client-cap-cases.sql
      - name: Verify simultaneous inserts cannot exceed five
        run: bash scripts/verify-free-client-race.sh
