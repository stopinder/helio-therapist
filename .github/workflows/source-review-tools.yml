name: Source review local test tools
on:
  push:
    branches: [fix/summary-source-review-20261105]
    paths: [.github/workflows/source-review-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned Supabase CLI and verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tools
          cd /tmp/tools
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v3.0.0/supabase_3.0.0_linux_amd64.tar.gz -o supabase.tar.gz
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v3.0.0/checksums.txt -o checksums.txt
          grep 'supabase_3.0.0_linux_amd64.tar.gz$' checksums.txt | sed 's/supabase_3.0.0_linux_amd64.tar.gz/supabase.tar.gz/' | sha256sum -c -
          curl --fail --silent --show-error --location https://supabase.com/changelog.md -o supabase-changelog.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review-local-tools
          path: /tmp/tools/
          retention-days: 1
          compression-level: 0
