name: Security baseline comparison
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  baseline-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Baseline component results
        run: npm run test:components
