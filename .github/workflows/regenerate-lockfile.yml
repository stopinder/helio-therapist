name: Regenerate npm lockfile

on:
  push:
    branches:
      - chore/regenerate-npm-lockfile

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/regenerate-npm-lockfile
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push origin HEAD:chore/regenerate-npm-lockfile

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-fund

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
