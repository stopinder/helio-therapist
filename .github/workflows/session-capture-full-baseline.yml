name: Session Capture Full Baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for dependency overrides
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Run all unit tests on deployed commit
        run: npm test
